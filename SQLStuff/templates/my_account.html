<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account · Brooke Point Library</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><header class="top"><strong>Brooke Point Library</strong><nav><a href="/">Home</a><a href="/books">Books</a><a href="/my-account">My Account</a><a href="/admin" id="adminLink" hidden>Admin</a><button class="secondary" onclick="logout()">Log Out</button></nav></header>
<main class="wrap"><h1>My Account</h1><p id="welcome" class="muted"></p><section class="panel"><h2>My Loans</h2><div id="loans">Loading...</div></section><a class="btn" href="/books">Browse Books</a></main>
<script>
async function load(){const me=await fetch('/api/me');if(!me.ok){location.href='/login';return;}const u=await me.json();document.getElementById('welcome').textContent=`Welcome, ${u.username}. Your standard loan period is 14 days.`;if(u.role==='admin')document.getElementById('adminLink').hidden=false;const r=await fetch('/api/my-loans');const loans=await r.json();const el=document.getElementById('loans');if(!loans.length){el.textContent='You have no borrowing history yet.';return;}el.innerHTML='<table><thead><tr><th>Book</th><th>Checked out</th><th>Due</th><th>Status</th><th>Action</th></tr></thead><tbody>'+loans.map(l=>`<tr><td>${esc(l.title)}<br><small>${esc(l.author)}</small></td><td>${l.checkout_date}</td><td>${l.due_date}</td><td>${l.status==='returned'?'Returned':l.return_requested_at?'Return requested':l.overdue?'<span class="error">Overdue</span>':'Active'}</td><td>${l.status==='active'?(l.return_requested_at?'<span class="muted">Awaiting staff confirmation</span>':`<button class="secondary" onclick="requestReturn(${l.loan_id})">Request Return</button>`):'—'}</td></tr>`).join('')+'</tbody></table>';}
async function requestReturn(id){if(!confirm('Submit a return request for this book? It will remain checked out until library staff confirm they have received it.'))return;try{const r=await fetch(`/api/my-loans/${id}/request-return`,{method:'POST'});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');alert(d.message);load();}catch(e){alert(e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/';}load();
</script></body></html>
