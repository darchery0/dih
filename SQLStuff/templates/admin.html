<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Brooke Point Library</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><header class="top"><strong>Brooke Point Library · Admin</strong><nav><a href="/">Home</a><a href="/books">Catalog</a><a href="/my-account">My Account</a><button class="secondary" onclick="logout()">Log Out</button></nav></header>
<main class="wrap"><h1>Admin Dashboard</h1><section class="grid" id="stats"></section>
<section class="panel"><h2>Website Notifications <span id="unread"></span></h2><p><button class="secondary" id="clearReviewed" onclick="clearReviewedNotifications()">Clear reviewed notifications</button></p><div id="notifications">Loading...</div></section>
<section class="panel"><h2>Checkout Management</h2><div id="loans">Loading...</div></section>
<section class="panel"><h2>Add a Book</h2><form id="addBook" class="row"><input name="title" placeholder="Title" required><input name="author" placeholder="Author" required><input name="genre" placeholder="Genre" required><input name="total_copies" type="number" min="1" value="1" required><button>Add Book</button></form><p id="bookMessage"></p></section>
<section class="panel"><h2>Manage Inventory</h2><div id="inventory">Loading...</div></section>
<section class="panel"><h2>User Accounts</h2><form id="addUser" class="row"><input name="username" placeholder="Username" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (8+ chars)" required><select name="role"><option value="citizen">Citizen</option><option value="volunteer">Volunteer</option><option value="admin">Admin</option></select><button>Create User</button></form><div id="users"></div></section>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}
async function load(){const me=await fetch('/api/me');if(!me.ok){location.href='/login';return;}const u=await me.json();if(u.role!=='admin'){location.href='/my-account';return;}
const [s,n,l,b,users]=await Promise.all([api('/api/admin/summary'),api('/api/admin/notifications'),api('/api/admin/loans'),api('/api/books'),api('/api/admin/users')]);
document.getElementById('stats').innerHTML=[['Book titles',s.titles],['Total copies',s.copies],['Available',s.available],['Active loans',s.active],['Overdue',s.overdue],['Unreviewed alerts',s.unreviewed],['Users',s.users]].map(x=>`<div class="stat"><strong>${x[1]}</strong>${x[0]}</div>`).join('');
document.getElementById('unread').textContent=`(${s.unreviewed} unreviewed)`;
document.getElementById('notifications').innerHTML=n.length?n.map(x=>`<div class="notice"><b>${esc(x.notification_type)}</b> · ${esc(x.message)}<br><small>${x.created_at}</small>${x.reviewed_at?'<p class="success">Reviewed</p>':`<p><button class="secondary" onclick="review(${x.notification_id})">Mark reviewed</button></p>`}</div>`).join(''):'No notifications yet.';
document.getElementById('loans').innerHTML=l.length?'<table><tr><th>Borrower</th><th>Book</th><th>Checkout</th><th>Due</th><th>Status</th><th>Action</th></tr>'+l.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.title)}</td><td>${x.checkout_date}</td><td>${x.due_date}</td><td>${x.status==='returned'?'Returned':x.return_requested_at?'<span class="success">Return requested</span>':x.overdue?'<span class="error">Overdue</span>':'Active'}</td><td>${x.status==='active'?`<button onclick="returnBook(${x.loan_id})">Mark returned</button>`:'—'}</td></tr>`).join('')+'</table>':'No checkouts yet.';
document.getElementById('inventory').innerHTML='<table><tr><th>Book</th><th>Author</th><th>Genre</th><th>Available / Total</th><th>Action</th></tr>'+b.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.author)}</td><td>${esc(x.genre)}</td><td>${x.available_copies} / ${x.total_copies}</td><td><button class="secondary" onclick="editBook(${x.id},${JSON.stringify(x.title)},${JSON.stringify(x.author)},${JSON.stringify(x.genre)},${x.total_copies})">Edit</button> <button class="secondary" onclick="deleteBook(${x.id})">Delete</button></td></tr>`).join('')+'</table>';
document.getElementById('users').innerHTML='<table><tr><th>Username</th><th>Email</th><th>Role</th><th>Change role</th></tr>'+users.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.email)}</td><td>${esc(x.user_role)}</td><td><select id="role${x.user_id}"><option ${x.user_role==='citizen'?'selected':''}>citizen</option><option ${x.user_role==='volunteer'?'selected':''}>volunteer</option><option ${x.user_role==='admin'?'selected':''}>admin</option></select><button onclick="changeRole(${x.user_id})">Save</button></td></tr>`).join('')+'</table>';
}
async function review(id){try{await api(`/api/admin/notifications/${id}/review`,{method:'POST'});load();}catch(e){alert(e.message)}}
async function clearReviewedNotifications(){if(!confirm('Permanently clear all reviewed notifications? Unreviewed notifications will be kept.'))return;try{const result=await api('/api/admin/notifications/clear-reviewed',{method:'POST'});alert(`${result.deleted} reviewed notification(s) cleared.`);load();}catch(e){alert(e.message)}}
async function returnBook(id){try{await api(`/api/admin/loans/${id}/return`,{method:'POST'});load();}catch(e){alert(e.message)}}
async function editBook(id,title,author,genre,total){const t=prompt('Book title:',title);if(t===null)return;const a=prompt('Author:',author);if(a===null)return;const g=prompt('Genre:',genre);if(g===null)return;const c=prompt('Total copies:',total);if(c===null)return;try{await api(`/api/admin/books/${id}`,{method:'PUT',body:JSON.stringify({title:t,author:a,genre:g,total_copies:c})});load();}catch(e){alert(e.message)}}
async function deleteBook(id){if(!confirm('Delete this book? Books with borrowing history cannot be deleted.'))return;try{await api(`/api/admin/books/${id}`,{method:'DELETE'});load();}catch(e){alert(e.message)}}
async function changeRole(id){try{await api(`/api/admin/users/${id}/role`,{method:'PATCH',body:JSON.stringify({role:document.getElementById('role'+id).value})});load();}catch(e){alert(e.message)}}
document.getElementById('addBook').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/admin/books',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();document.getElementById('bookMessage').textContent='Book added.';load();}catch(err){document.getElementById('bookMessage').textContent=err.message;}});
document.getElementById('addUser').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/admin/users',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load();}catch(err){alert(err.message)}});
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/';}load();
</script></body></html>
