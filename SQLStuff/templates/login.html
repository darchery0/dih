<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Brooke Point Library</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><header class="top"><strong>Brooke Point Library</strong><nav><a href="/">Home</a><a href="/books">Books</a></nav></header><main class="wrap"><section class="panel" style="max-width:460px;margin:auto"><h1>Library Login</h1><form id="login"><label>Username<br><input name="username" required autocomplete="username"></label><br><label>Password<br><input name="password" type="password" required autocomplete="current-password"></label><br><button>Log In</button></form><p id="message" role="status"></p></section></main>
<script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();const m=document.getElementById('message');if(!r.ok){m.className='error';m.textContent=d.error||'Login failed';return;}location.href=d.redirect;});</script></body></html>
